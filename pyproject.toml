[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videoqa-evidencelab"
version = "0.1.0"
description = "Resumable, budgeted inference experiments for NExT-QA and LongVideoBench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vqa = "evidencelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidencelab = ["_vendor/*.txt"]

[tool.ruff]
line-length = 110
target-version = "py310"
