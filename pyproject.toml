[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videoqa-evidencelab"
version = "0.1.0"
description = "Resumable, budgeted inference experiments for NExT-QA and LongVideoBench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vqa = "evidencelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidencelab = ["_vendor/*.txt", "_vendor/lens/manifest.json", "_vendor/lens/LICENSE",
              "_vendor/lens/API_CLIP/clip_prs/LICENSE.txt", "_vendor/lens/API_CLIP/clip_prs/README.md",
              "_vendor/lens/API_CLIP/clip_prs/environment.yml",
              "_vendor/lens/API_CLIP/clip_prs/utils/model_configs/*.json",
              "_vendor/lens/API_CLIP/clip_prs/utils/vocab/*.gz"]

[tool.ruff]
line-length = 110
target-version = "py310"
