name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . numpy==2.2.6 scipy==1.15.3 requests==2.32.5 Pillow==11.3.0 av==15.1.0 opencv-python-headless==4.11.0.86 ftfy==6.3.1 einops==0.8.1 huggingface-hub==0.35.3 regex==2026.9.10
      - run: python -m unittest discover -s tests -v
      - run: python -m evidencelab demo --output /tmp/evidencelab-demo
      - run: bash -n scripts/slurm/job.sh
      - run: bash -n scripts/slurm/longvideo_job.sh
